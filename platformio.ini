[env:esp32s3_amoled]
;platform  = espressif32 @ 6.8.1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3 AMOLED 1.75": 16 MB flash, 8 MB OPI PSRAM
board_build.mcu              = esp32s3
board_build.f_cpu            = 240000000L
board_build.flash_size       = 16MB
board_build.flash_mode       = qio
board_build.partitions       = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; enables OPI PSRAM
board_upload.flash_size      = 16MB

monitor_speed  = 115200
upload_speed   = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I.                          ; makes lv_conf.h findable from project root
    -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
    ;https://github.com/moononournation/Arduino_GFX.git#v1.5.9
    moononournation/GFX Library for Arduino @ 1.6.4
    lvgl/lvgl                          @ ^9.5.0
    bblanchon/ArduinoJson              @ ^7.4.0
    tzapu/WiFiManager                  @ ^2.0.17
    ayushsharma82/ElegantOTA           @ ^3.0.0
    https://github.com/lewisxhe/XPowersLib.git
